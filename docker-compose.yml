services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-your_binance_api_key_here}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-your_binance_api_secret_here}
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - trading-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
